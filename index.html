 if(dx||dy){const run=(k('ShiftLeft')||k('ShiftRight')||T.run)&&S.e>5,l=Math.hypot(dx,dy),sp=(run?135:75)*dt;if(run)ch('e',-dt*.6);const ox=S.x,oy=S.y;mv(dx/l*sp,0);mv(0,dy/l*sp);S.fr+=dt*(run?20:14);if(S.x==ox&&S.y==oy){S.stk=(S.stk||0)+dt;if(S.stk>2){S.stk=0;unstick()}}else S.stk=0}else S.stk=0

 {const hz=HRS[S.map];S.kd=S.kd||{};if(hz&&!opn(hz)&&!S.kd[S.map]){S.kd[S.map]=1;closeUp(S.map);return}}
 if(S.map=='class'&&!cur()){const h=hh();if(h>=18.5&&!S.lk){S.lk=1;lockClass();return}if(h>=17.75&&h<18.5&&!S.eg){S.eg=1;eggClass();return}}
